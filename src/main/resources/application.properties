spring.application.name=sparse-eigensolver-java

# Eigensolver service limits (override per environment as needed)
solver.max-dimension=4000
solver.max-non-zeros=20000000
solver.max-request-bytes=536870912
solver.per-request-memory-bytes=536870912
solver.max-concurrency=4
solver.queue-capacity=256
solver.default-time-limit-ms=60000
solver.max-time-limit-ms=600000
solver.default-max-iterations=300
solver.max-iterations=2000
solver.snapshot-interval-ms=1000
solver.snapshot-dir=data/snapshots
