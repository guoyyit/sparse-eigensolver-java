# Sparse eigensolver service limits (see README for semantics)
solver.max-dimension=200000
solver.max-nnz=5000000
solver.max-concurrent-tasks=4
solver.max-wall-millis=60000
solver.max-memory-bytes=536870912
solver.snapshot-dir=data/snapshots
solver.audit-file=data/audit.log

server.port=8080
spring.application.name=sparse-eigensolver
